<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Lab</title>
<style>
  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --text: #1f1e1c;
    --muted: #6b6862;
    --border: #dcd9d2;
    --accent: #c15f3c;
    --accent-text: #ffffff;
    --system-bg: #f0eee8;
    --user-bg: #eef3fb;
    --claude-bg: #fbf3ee;
    --note-text: #7a5a00;
    --note-bg: #fff6d9;
    --error-text: #a3221b;
    --error-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18;
      --panel: #252421;
      --text: #ece9e3;
      --muted: #a29e96;
      --border: #3b3935;
      --accent: #d9774f;
      --accent-text: #1b1a18;
      --system-bg: #2d2b28;
      --user-bg: #22293a;
      --claude-bg: #33271f;
      --note-text: #f0d27a;
      --note-bg: #3a3218;
      --error-text: #ffb4ab;
      --error-bg: #3d1f1c;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }

  .app {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 { margin: 0; font-size: 1.5rem; }
  .model { color: var(--muted); font-size: 0.9rem; font-family: ui-monospace, Menlo, monospace; }

  label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 4px;
  }
  .hint { font-weight: 400; color: var(--muted); }

  input, textarea {
    width: 100%;
    padding: 8px 10px;
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  textarea { resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .log {
    flex: 1;
    min-height: 280px;
    max-height: 55vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .empty { color: var(--muted); text-align: center; margin: auto; }

  .msg {
    border-radius: 6px;
    padding: 8px 12px;
  }
  .msg .who {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.system { background: var(--system-bg); }
  .msg.user { background: var(--user-bg); }
  .msg.assistant { background: var(--claude-bg); }
  .msg.note { background: var(--note-bg); color: var(--note-text); font-size: 0.9rem; }
  .msg.error { background: var(--error-bg); color: var(--error-text); }
  .msg.error .who { color: var(--error-text); }
  .msg.failed { opacity: 0.6; }
  .msg.failed .who::after { content: " (not sent to Claude)"; text-transform: none; font-weight: 400; }

  .waiting { color: var(--muted); font-style: italic; }
  .dots::after {
    content: "";
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }

  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .actions .spacer { flex: 1; }
  .actions .tip { color: var(--muted); font-size: 0.8rem; }

  button {
    font: inherit;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Prompt Lab</h1>
    <span class="model" id="modelName"></span>
  </header>

  <div>
    <label for="apiKey">Anthropic API key <span class="hint">(kept in memory only; never saved)</span></label>
    <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-...">
  </div>

  <div>
    <label for="systemPrompt">System prompt <span class="hint">(optional)</span></label>
    <textarea id="systemPrompt" rows="3" placeholder="e.g. You are a concise tutor for an MBA course."></textarea>
  </div>

  <div class="log" id="log" aria-live="polite"></div>

  <div>
    <label for="prompt">Prompt</label>
    <textarea id="prompt" rows="4" placeholder="Type a prompt for Claude..."></textarea>
  </div>

  <div class="actions">
    <button class="primary" id="sendBtn">Send</button>
    <span class="tip">Ctrl/⌘ + Enter to send</span>
    <span class="spacer"></span>
    <button id="newBtn">New Conversation</button>
    <button id="exportBtn">Export</button>
  </div>
</div>

<script>
  const MODEL = "claude-sonnet-5";
  const API_URL = "https://api.anthropic.com/v1/messages";

  const apiKeyInput = document.getElementById("apiKey");
  const systemInput = document.getElementById("systemPrompt");
  const promptInput = document.getElementById("prompt");
  const logEl = document.getElementById("log");
  const sendBtn = document.getElementById("sendBtn");
  const newBtn = document.getElementById("newBtn");
  const exportBtn = document.getElementById("exportBtn");

  document.getElementById("modelName").textContent = MODEL;

  // What the log shows (and what Export writes).
  // Each entry: { kind: "system" | "user" | "assistant" | "note" | "error", text, failed? }
  let entries = [];
  // What Claude is sent: the user/assistant turns so far, in API format.
  let messages = [];
  // The system prompt Claude saw on the last successful send (null = none sent yet).
  let activeSystem = null;
  // Bumped by New Conversation so a late reply from an old conversation is ignored.
  let conversationId = 0;
  let waiting = false;

  const LABELS = { system: "System", user: "You", assistant: "Claude", note: "Note", error: "Error" };

  function render() {
    logEl.innerHTML = "";
    if (entries.length === 0 && !waiting) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No messages yet. Each prompt is sent along with the whole conversation shown here.";
      logEl.appendChild(empty);
    }
    for (const entry of entries) {
      const div = document.createElement("div");
      div.className = "msg " + entry.kind + (entry.failed ? " failed" : "");
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = LABELS[entry.kind];
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = entry.text;
      div.append(who, body);
      logEl.appendChild(div);
    }
    if (waiting) {
      const div = document.createElement("div");
      div.className = "msg assistant waiting";
      div.innerHTML = '<div class="who">Claude</div><div class="body"><span class="dots">Claude is responding</span></div>';
      logEl.appendChild(div);
    }
    logEl.scrollTop = logEl.scrollHeight;

    sendBtn.disabled = waiting;
    exportBtn.disabled = entries.length === 0;
  }

  // Log the system prompt the first time it is used, and note any change after that.
  function logSystemIfChanged(system) {
    if (activeSystem === null) {
      if (system) entries.push({ kind: "system", text: system });
    } else if (system !== activeSystem) {
      if (system) {
        entries.push({ kind: "note", text: "System prompt changed. From here on, Claude sees the new system prompt below." });
        entries.push({ kind: "system", text: system });
      } else {
        entries.push({ kind: "note", text: "System prompt removed. From here on, Claude sees no system prompt." });
      }
    }
    activeSystem = system;
  }

  function describeError(status, data) {
    const apiMessage = data && data.error && data.error.message;
    if (status === 401) return "Invalid API key (401). Check the key and try again.";
    if (apiMessage) return `API error ${status}: ${apiMessage}`;
    return `API error ${status}.`;
  }

  async function send() {
    if (waiting) return;
    const apiKey = apiKeyInput.value.trim();
    const prompt = promptInput.value.trim();
    const system = systemInput.value.trim();

    if (!apiKey) { apiKeyInput.focus(); alert("Paste your Anthropic API key first."); return; }
    if (!prompt) { promptInput.focus(); return; }

    logSystemIfChanged(system);

    const userEntry = { kind: "user", text: prompt };
    entries.push(userEntry);
    messages.push({ role: "user", content: prompt });
    promptInput.value = "";

    const body = { model: MODEL, max_tokens: 16000, messages };
    if (system) body.system = system;

    const thisConversation = conversationId;
    waiting = true;
    render();

    let errorText = null;
    let replyContent = null;
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2026-10-21",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify(body)
      });
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        errorText = describeError(response.status, data);
      } else if (data.stop_reason === "refusal") {
        errorText = "Claude declined to answer this prompt (stop reason: refusal).";
      } else {
        replyContent = data.content;
        if (data.stop_reason === "max_tokens") {
          errorText = "The reply hit the max_tokens limit and was cut off.";
        }
      }
    } catch (err) {
      errorText = "Network error: " + err.message + ". Check your connection.";
    }

    if (thisConversation !== conversationId) return; // conversation was reset while waiting
    waiting = false;

    if (replyContent) {
      // Send Claude's full reply back on later turns, but show only its text.
      messages.push({ role: "assistant", content: replyContent });
      const text = replyContent.filter(b => b.type === "text").map(b => b.text).join("");
      entries.push({ kind: "assistant", text: text || "(empty reply)" });
    } else {
      // The failed prompt is not part of the conversation Claude will see next time.
      messages.pop();
      userEntry.failed = true;
      if (!promptInput.value) promptInput.value = prompt;
    }
    if (errorText) entries.push({ kind: "error", text: errorText });
    render();
  }

  function newConversation() {
    conversationId++;
    entries = [];
    messages = [];
    activeSystem = null;
    waiting = false;
    render();
    promptInput.focus();
  }

  function exportMarkdown() {
    const headings = { system: "System", user: "You", assistant: "Claude" };
    const parts = [MODEL];
    for (const entry of entries) {
      if (!headings[entry.kind] || entry.failed) continue;
      parts.push(`### ${headings[entry.kind]}\n\n${entry.text}`);
    }
    const blob = new Blob([parts.join("\n\n") + "\n"], { type: "text/markdown" });
    const stamp = new Date().toISOString().slice(0, 16).replace("T", "-").replace(":", "");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `prompt-lab-${stamp}.md`;
    link.click();
    URL.revokeObjectURL(link.href);
  }

  sendBtn.addEventListener("click", send);
  newBtn.addEventListener("click", newConversation);
  exportBtn.addEventListener("click", exportMarkdown);
  promptInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
  });

  render();
</script>
</body>
</html>
