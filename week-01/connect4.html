<title>Connect 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: board-first split. The board owns the stage; a narrow rail holds status, score and controls. Stacks on phones. */
  :root {
    --paper: #e8edf4;
    --surface: #f6f8fb;
    --ink: #141c30;
    --muted: #56627a;
    --line: #c8d1df;
    --slot: #cdd6e4;
    --board: #1f4bb5;
    --board-hi: #3462d1;
    --red: #e3412f;
    --red-hi: #ff8b78;
    --red-lo: #a8261a;
    --amber: #f2b01e;
    --amber-hi: #ffe28f;
    --amber-lo: #bf800a;
    --focus: #f2b01e;
    --on-board: #ffffff;

    --font-display: "Unbounded", "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0c1222;
      --surface: #131b30;
      --ink: #e7ecf6;
      --muted: #9aa6bf;
      --line: #263252;
      --slot: #060b19;
      --board: #2350c2;
      --board-hi: #3a6ae0;
      --focus: #ffd261;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0c1222;
    --surface: #131b30;
    --ink: #e7ecf6;
    --muted: #9aa6bf;
    --line: #263252;
    --slot: #060b19;
    --board: #2350c2;
    --board-hi: #3a6ae0;
    --focus: #ffd261;
  }

  html, body { min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
  }

  .app {
    max-width: 1060px;
    margin: 0 auto;
    padding-block: clamp(20px, 4vw, 48px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    grid-template-areas: "table head" "table controls";
    grid-template-rows: auto 1fr;
    column-gap: clamp(28px, 5vw, 64px);
    row-gap: 24px;
    align-items: start;
  }
  .head { grid-area: head; display: grid; gap: 20px; }
  .table { grid-area: table; }
  .controls { grid-area: controls; display: grid; gap: 24px; }
  @media (max-width: 820px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "head" "table" "controls";
      grid-template-rows: auto;
    }
  }

  /* ---------- Rail ---------- */
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.1rem, 4.4vw, 2.9rem);
    line-height: 1;
    letter-spacing: -0.03em;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .lede { margin: 0; color: var(--muted); max-width: 34ch; }

  .status {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 14px;
    align-items: center;
    padding-block: 18px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    min-height: 92px;
  }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, var(--hi) 0 16%, var(--base) 55%, var(--lo) 100%);
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.1);
    flex: none;
  }
  .swatch.p1, .disc.p1 { --base: var(--red); --hi: var(--red-hi); --lo: var(--red-lo); }
  .swatch.p2, .disc.p2 { --base: var(--amber); --hi: var(--amber-hi); --lo: var(--amber-lo); }
  .swatch.p0 { --base: var(--line); --hi: var(--surface); --lo: var(--muted); }
  .status .swatch { grid-row: span 2; width: 30px; height: 30px; }
  .status-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.35rem;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .status-sub { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .thinking::after {
    content: "";
    display: inline-block;
    width: 1.2em;
    text-align: left;
    animation: dots 1.1s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; }
  }

  .score {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .score div { display: grid; gap: 2px; }
  .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .label .swatch { width: 11px; height: 11px; box-shadow: none; }
  .score output {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.9rem;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 8px; }
  legend { padding: 0; margin-bottom: 8px; }
  .seg {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 3px;
    gap: 3px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .seg.two { grid-template-columns: repeat(2, 1fr); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    text-align: center;
    padding: 8px 4px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--muted);
    transition: background .15s, color .15s;
  }
  .seg label:hover { color: var(--ink); }
  .seg input:checked + label { background: var(--ink); color: var(--paper); }
  .seg input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 1px; }
  .hint { margin: 0; font-size: 0.88rem; color: var(--muted); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 11px 18px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .1s, background .15s, border-color .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .btn-primary { background: var(--board); color: var(--on-board); }
  .btn-primary:hover { background: var(--board-hi); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }

  .sequence {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    word-break: break-all;
    margin: 0;
    min-height: 1.5em;
    color: var(--ink);
  }
  .sequence:empty::before { content: "No moves yet"; color: var(--muted); letter-spacing: 0; font-family: var(--font-body); }

  /* ---------- Board ---------- */
  .table { padding-inline: 3%; padding-bottom: 6px; }
  .stage {
    container-type: inline-size;
    position: relative;
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    aspect-ratio: 1 / 1; /* one hover row + six board rows, seven columns */
    touch-action: manipulation;
  }
  .slots, .board, .rim {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    top: calc(100% / 7);
  }
  .slots { background: var(--slot); z-index: 0; }
  .discs { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .board {
    z-index: 2;
    background: var(--board);
    -webkit-mask: radial-gradient(circle closest-side, transparent 80%, #000 calc(80% + 0.6px)) 0 0 / calc(100% / 7) calc(100% / 6) repeat;
            mask: radial-gradient(circle closest-side, transparent 80%, #000 calc(80% + 0.6px)) 0 0 / calc(100% / 7) calc(100% / 6) repeat;
  }
  .rim {
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(circle closest-side, transparent 79%, rgba(0,0,0,.32) 80.5%, rgba(0,0,0,0) 85%, rgba(255,255,255,.14) 88%, transparent 93%) 0 0 / calc(100% / 7) calc(100% / 6) repeat;
  }
  .frame {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    top: calc(100% / 7 - 2.2cqw);
    left: -2.2cqw; right: -2.2cqw; bottom: -2.2cqw;
    border: 2.2cqw solid var(--board);
    border-radius: 3cqw;
    box-shadow: 0 2.4cqw 4cqw -1.6cqw rgba(10, 25, 70, .45), inset 0 0 0 1px rgba(255,255,255,.06);
  }

  .disc {
    position: absolute;
    left: calc(var(--c) * 100% / 7);
    top: calc((var(--r) + 1) * 100% / 7);
    width: calc(100% / 7);
    height: calc(100% / 7);
  }
  .disc::before {
    content: "";
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, var(--hi) 0 14%, var(--base) 52%, var(--lo) 100%);
    box-shadow: inset 0 -0.6cqw 1.1cqw rgba(0,0,0,.22), inset 0 0 0 1cqw rgba(0,0,0,.07);
  }
  .disc::after {
    content: "";
    position: absolute;
    inset: 26%;
    border-radius: 50%;
    box-shadow: inset 0 0.35cqw 0.5cqw rgba(0,0,0,.24), 0 0.3cqw 0.3cqw rgba(255,255,255,.28);
  }
  .disc.ghost {
    --r: -1;
    opacity: .6;
    transition: left .12s ease-out, opacity .15s;
  }
  .disc.ghost[hidden] { display: block !important; opacity: 0; }
  .stage.over .disc:not(.win):not(.ghost) { filter: saturate(.55) brightness(.8); transition: filter .4s; }
  .disc.win::after {
    inset: 22%;
    box-shadow: 0 0 0 0.9cqw rgba(255,255,255,.92), 0 0 2cqw rgba(255,255,255,.6);
    animation: glint 1.4s ease-in-out infinite;
  }
  @keyframes glint { 50% { transform: scale(.82); opacity: .75; } }

  .cols {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .cols button {
    appearance: none;
    background: transparent;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    border-radius: 2cqw;
  }
  .cols button:disabled { cursor: default; }
  .cols button:focus-visible { outline: 3px solid var(--focus); outline-offset: -2px; }

  .numbers {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    max-width: 620px;
    margin: 22px auto 0;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
  .numbers span { transition: color .12s; }
  .numbers span.on { color: var(--ink); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .disc.win::after, .thinking::after { animation: none; }
    .disc.ghost { transition: none; }
  }
</style>

<main class="app">
  <section class="head" aria-label="Game status">
    <div>
      <p class="eyebrow">7 columns · 6 rows · 42 discs</p>
      <h1>Connect 4</h1>
      <p class="lede" id="lede">Line up four of your red discs across, down, or on a diagonal before the computer does.</p>
    </div>
    <div class="status" aria-live="polite">
      <span class="swatch p1" id="status-swatch"></span>
      <p class="status-title" id="status-title">Your move</p>
      <p class="status-sub" id="status-sub">Choose a column, or press 1–7.</p>
    </div>
  </section>

  <section class="table" aria-label="Board">
    <div class="stage" id="stage">
      <div class="slots"></div>
      <div class="discs" id="discs"><div class="disc ghost p1" id="ghost" style="--c:3" hidden></div></div>
      <div class="board"></div>
      <div class="rim"></div>
      <div class="frame"></div>
      <div class="cols" id="cols"></div>
    </div>
    <div class="numbers" id="numbers" aria-hidden="true"></div>
  </section>

  <section class="controls" aria-label="Controls">
    <fieldset>
      <legend class="label">Opponent</legend>
      <div class="seg two">
        <input type="radio" name="mode" id="mode-ai" value="ai"><label for="mode-ai">Computer</label>
        <input type="radio" name="mode" id="mode-pvp" value="pvp"><label for="mode-pvp">Two players</label>
      </div>
      <p class="hint">Switching starts a new game. Each mode keeps its own score.</p>
    </fieldset>

    <div class="score">
      <div><span class="label"><span class="swatch p1"></span><span id="name-1">You</span></span><output id="score-you">0</output></div>
      <div><span class="label">Draws</span><output id="score-draw">0</output></div>
      <div><span class="label"><span class="swatch p2"></span><span id="name-2">Computer</span></span><output id="score-ai">0</output></div>
    </div>

    <fieldset id="level-field">
      <legend class="label">Computer strength</legend>
      <div class="seg">
        <input type="radio" name="level" id="level-easy" value="easy"><label for="level-easy">Easy</label>
        <input type="radio" name="level" id="level-medium" value="medium"><label for="level-medium">Medium</label>
        <input type="radio" name="level" id="level-hard" value="hard"><label for="level-hard">Hard</label>
      </div>
      <p class="hint" id="level-hint"></p>
    </fieldset>

    <div class="actions">
      <button class="btn btn-primary" id="new-game" type="button">New game</button>
      <button class="btn btn-ghost" id="undo" type="button">Undo move</button>
    </div>
    <p class="hint" id="next-start"></p>

    <div>
      <p class="label" style="margin:0 0 6px">Move sequence</p>
      <p class="sequence" id="sequence"></p>
    </div>
  </section>
</main>

<script>
(() => {
  const ROWS = 6, COLS = 7, HUMAN = 1, AI = 2;
  const ORDER = [3, 2, 4, 1, 5, 0, 6];
  const WIN = 1e6;
  const LEVELS = {
    easy:   { depth: 2, noise: 6, hint: "Sees one move ahead. Blocks obvious wins." },
    medium: { depth: 4, noise: 2, hint: "Looks four moves ahead and sets up threats." },
    hard:   { depth: 7, noise: 0, hint: "Looks seven moves ahead. Tough to beat." },
  };
  const STORE_KEY = "connect4-gbus562";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), discsEl = $("discs"), ghost = $("ghost"), colsEl = $("cols"), numbersEl = $("numbers");

  let state, busy = false, hoverCol = null, aiTimer = null;

  // ---------- Rules ----------
  const at = (r, c) => r * COLS + c;
  function dropRow(cells, c) {
    for (let r = ROWS - 1; r >= 0; r--) if (cells[at(r, c)] === 0) return r;
    return -1;
  }
  function winLine(cells, r, c, p) {
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const line = [[r, c]];
      for (const s of [1, -1]) {
        let rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && cells[at(rr, cc)] === p) {
          line.push([rr, cc]); rr += dr * s; cc += dc * s;
        }
      }
      if (line.length >= 4) return line;
    }
    return null;
  }
  const firstPlayer = () => (state.humanStarts ? HUMAN : AI);
  const playerOfMove = (i) => (i % 2 === 0 ? firstPlayer() : 3 - firstPlayer());
  const turn = () => playerOfMove(state.moves.length);
  const isPvp = () => state.mode === "pvp";
  const humanTurn = () => isPvp() || turn() === HUMAN;
  const score = () => state.scores[state.mode];
  const NAMES = { ai: ["", "You", "Computer"], pvp: ["", "Red", "Amber"] };
  const name = (p) => NAMES[state.mode][p];
  const zeroScore = () => ({ you: 0, ai: 0, draw: 0 });

  // ---------- Computer player: negamax with alpha-beta ----------
  const WINDOWS = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const er = r + dr * 3, ec = c + dc * 3;
      if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
      WINDOWS.push([0, 1, 2, 3].map((k) => at(r + dr * k, c + dc * k)));
    }
  }
  function evaluate(cells, p) {
    let s = 0;
    for (let r = 0; r < ROWS; r++) {
      const v = cells[at(r, 3)];
      if (v === p) s += 3; else if (v) s -= 3;
    }
    for (const w of WINDOWS) {
      let mine = 0, theirs = 0;
      for (const i of w) { const v = cells[i]; if (v === p) mine++; else if (v) theirs++; }
      if (mine && theirs) continue;
      if (mine === 3) s += 6;
      else if (mine === 2) s += 2;
      else if (theirs === 3) s -= 7;
      else if (theirs === 2) s -= 2;
    }
    return s;
  }
  function negamax(cells, depth, alpha, beta, p, ply, empty) {
    if (empty === 0) return 0;
    for (const c of ORDER) {
      const r = dropRow(cells, c);
      if (r < 0) continue;
      cells[at(r, c)] = p;
      const won = winLine(cells, r, c, p);
      cells[at(r, c)] = 0;
      if (won) return WIN - ply;
    }
    if (depth === 0) return evaluate(cells, p);
    let best = -Infinity;
    for (const c of ORDER) {
      const r = dropRow(cells, c);
      if (r < 0) continue;
      cells[at(r, c)] = p;
      const v = -negamax(cells, depth - 1, -beta, -alpha, 3 - p, ply + 1, empty - 1);
      cells[at(r, c)] = 0;
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }
  function chooseMove(cellsIn, levelKey) {
    const { depth, noise } = LEVELS[levelKey];
    const cells = cellsIn.slice();
    const empty = cells.filter((v) => v === 0).length;
    for (const c of ORDER) {
      const r = dropRow(cells, c);
      if (r < 0) continue;
      cells[at(r, c)] = AI;
      const won = winLine(cells, r, c, AI);
      cells[at(r, c)] = 0;
      if (won) return c;
    }
    let best = -Infinity, bestCol = ORDER.find((c) => dropRow(cells, c) >= 0), alpha = -Infinity;
    for (const c of ORDER) {
      const r = dropRow(cells, c);
      if (r < 0) continue;
      cells[at(r, c)] = AI;
      let v = -negamax(cells, depth - 1, -Infinity, noise ? Infinity : -alpha, HUMAN, 1, empty - 1);
      cells[at(r, c)] = 0;
      if (noise && Math.abs(v) < WIN - 1000) v += Math.random() * noise;
      if (v > best) { best = v; bestCol = c; }
      if (!noise && v > alpha) alpha = v;
    }
    return bestCol;
  }
  function humanWinsAt(cells, c) {
    const r = dropRow(cells, c);
    if (r < 0) return false;
    cells[at(r, c)] = HUMAN;
    const won = winLine(cells, r, c, HUMAN);
    cells[at(r, c)] = 0;
    return !!won;
  }

  // ---------- Persistence ----------
  function loadSaved() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
  }
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ scores: state.scores, mode: state.mode, difficulty: state.difficulty, humanStarts: state.humanStarts }));
    } catch {}
  }
  function freshState(prev) {
    const saved = prev || loadSaved();
    return {
      cells: Array(ROWS * COLS).fill(0),
      moves: [],
      humanStarts: saved.humanStarts ?? true,
      over: null,
      mode: saved.mode === "pvp" ? "pvp" : "ai",
      scores: saved.scores || { ai: saved.score || zeroScore(), pvp: zeroScore() },
      difficulty: LEVELS[saved.difficulty] ? saved.difficulty : "medium",
      note: "",
    };
  }

  // ---------- Rendering ----------
  function renderDiscs() {
    for (const el of discsEl.querySelectorAll(".disc:not(.ghost)")) el.remove();
    const winSet = new Set((state.over?.line || []).map(([r, c]) => at(r, c)));
    let last = null;
    const lastIdx = state.moves.length ? (() => {
      const c = state.moves[state.moves.length - 1];
      for (let r = 0; r < ROWS; r++) if (state.cells[at(r, c)]) return at(r, c);
    })() : -1;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const v = state.cells[at(r, c)];
      if (!v) continue;
      const el = document.createElement("div");
      el.className = `disc p${v}` + (winSet.has(at(r, c)) ? " win" : "");
      el.style.setProperty("--r", r);
      el.style.setProperty("--c", c);
      discsEl.appendChild(el);
      if (at(r, c) === lastIdx) last = el;
    }
    stage.classList.toggle("over", !!state.over);
    return last;
  }
  function dropAnimation(el, r) {
    if (!el || reduceMotion || !el.animate) return Promise.resolve();
    const from = `translateY(${-(r + 1) * 100}%)`;
    const anim = el.animate([
      { transform: from, easing: "cubic-bezier(.55,0,1,.45)" },
      { transform: "translateY(0)", offset: 0.72, easing: "cubic-bezier(.2,.6,.4,1)" },
      { transform: "translateY(-14%)", offset: 0.86, easing: "cubic-bezier(.6,0,.8,.4)" },
      { transform: "translateY(0)" },
    ], { duration: 260 + r * 55 });
    return anim.finished.catch(() => {});
  }
  function renderGhost() {
    const show = hoverCol !== null && !busy && !state.over && humanTurn() && dropRow(state.cells, hoverCol) >= 0;
    ghost.className = `disc ghost p${turn()}`;
    ghost.hidden = !show;
    if (hoverCol !== null) ghost.style.setProperty("--c", hoverCol);
    [...numbersEl.children].forEach((s, i) => s.classList.toggle("on", show && i === hoverCol));
  }
  function renderUI() {
    const t = turn(), lvl = LEVELS[state.difficulty], pvp = isPvp();
    const title = $("status-title"), sub = $("status-sub"), sw = $("status-swatch");
    title.classList.remove("thinking");
    if (state.over) {
      const n = state.moves.length, w = state.over.winner;
      if (w) {
        sw.className = `swatch p${w}`;
        title.textContent = !pvp && w === HUMAN ? "You win" : `${name(w)} wins`;
        sub.textContent = !pvp && w === AI ? `It lined up four on move ${n}.` : `Four in a row on move ${n}.`;
      } else {
        sw.className = "swatch p0"; title.textContent = "Draw";
        sub.textContent = "All 42 spaces are full.";
      }
    } else if (humanTurn()) {
      sw.className = `swatch p${t}`;
      title.textContent = pvp ? `${name(t)}'s move` : "Your move";
      sub.textContent = state.note || "Choose a column, or press 1–7.";
    } else {
      sw.className = "swatch p2"; title.textContent = "Computer is thinking";
      title.classList.add("thinking");
      sub.textContent = `Looking ${lvl.depth} moves ahead.`;
    }

    const s = score();
    $("score-you").textContent = s.you;
    $("score-ai").textContent = s.ai;
    $("score-draw").textContent = s.draw;
    $("name-1").textContent = name(HUMAN);
    $("name-2").textContent = name(AI);
    $(`mode-${state.mode}`).checked = true;
    $("level-field").hidden = pvp;
    $(`level-${state.difficulty}`).checked = true;
    $("level-hint").textContent = lvl.hint;
    $("lede").textContent = pvp
      ? "Two players share this screen. Red and Amber take turns, and the first to line up four across, down, or on a diagonal wins."
      : "Line up four of your red discs across, down, or on a diagonal before the computer does.";
    $("next-start").textContent = pvp
      ? `Next game: ${state.humanStarts ? "Amber" : "Red"} will start.`
      : `Next game: ${state.humanStarts ? "the computer" : "you"} will start.`;
    $("sequence").textContent = state.moves.map((c) => c + 1).join("");
    $("undo").disabled = busy || !!state.over || (pvp
      ? !state.moves.length
      : t !== HUMAN || !state.moves.some((_, i) => playerOfMove(i) === HUMAN));

    const canDrop = !busy && !state.over && humanTurn();
    [...colsEl.children].forEach((b, c) => {
      b.disabled = !canDrop || dropRow(state.cells, c) < 0;
    });
    renderGhost();
  }

  // ---------- Game flow ----------
  async function play(c, p) {
    const r = dropRow(state.cells, c);
    if (r < 0) return;
    busy = true;
    const game = state;
    state.cells[at(r, c)] = p;
    state.moves.push(c);
    const line = winLine(state.cells, r, c, p);
    if (line) {
      state.over = { winner: p, line };
      score()[p === HUMAN ? "you" : "ai"]++;
    } else if (state.moves.length === ROWS * COLS) {
      state.over = { winner: 0, line: [] };
      score().draw++;
    }
    save();
    // Draw the dropping disc first; the win highlight lands after it settles.
    const over = state.over;
    state.over = null;
    const el = renderDiscs();
    renderUI();
    await dropAnimation(el, r);
    if (state !== game) return; // a new game or mode switch replaced this one mid-drop
    state.over = over;
    busy = false;
    renderDiscs();
    renderUI();
    if (!state.over && !isPvp() && turn() === AI) scheduleAI();
  }
  function scheduleAI() {
    busy = true;
    renderUI();
    clearTimeout(aiTimer);
    aiTimer = setTimeout(() => {
      const c = chooseMove(state.cells, state.difficulty);
      const blocked = humanWinsAt(state.cells.slice(), c);
      state.note = blocked ? `The computer blocked column ${c + 1}.` : `The computer played column ${c + 1}.`;
      busy = false;
      play(c, AI);
    }, 380 + Math.random() * 220);
  }
  function humanDrop(c) {
    if (busy || state.over || !humanTurn() || dropRow(state.cells, c) < 0) return;
    state.note = "";
    play(c, turn());
  }
  function rebuildCells() {
    state.cells = Array(ROWS * COLS).fill(0);
    state.moves.forEach((c, i) => { state.cells[at(dropRow(state.cells, c), c)] = playerOfMove(i); });
  }
  function undo() {
    if (busy || state.over) return;
    if (isPvp()) {
      if (!state.moves.length) return;
      const p = playerOfMove(state.moves.length - 1);
      state.moves.pop();
      rebuildCells();
      state.note = `Took back ${name(p)}'s move.`;
    } else {
      if (turn() !== HUMAN || !state.moves.some((_, i) => playerOfMove(i) === HUMAN)) return;
      while (state.moves.length && playerOfMove(state.moves.length - 1) === AI) state.moves.pop();
      state.moves.pop();
      rebuildCells();
      state.note = "Took back your last move.";
    }
    renderDiscs();
    renderUI();
  }
  function resetGame(overrides) {
    clearTimeout(aiTimer);
    busy = false;
    state = freshState({ scores: state.scores, mode: state.mode, difficulty: state.difficulty, humanStarts: state.humanStarts, ...overrides });
    save();
    renderDiscs();
    renderUI();
    if (!isPvp() && turn() === AI) scheduleAI();
  }
  function newGame() {
    resetGame({ humanStarts: !state.humanStarts });
  }
  function setMode(mode) {
    if (mode === state.mode) return;
    resetGame({ mode });
  }

  // ---------- Wiring ----------
  function bind() {
    for (let c = 0; c < COLS; c++) {
      const b = document.createElement("button");
      b.type = "button";
      b.id = `col-${c + 1}`;
      b.setAttribute("aria-label", `Drop a disc in column ${c + 1}`);
      b.addEventListener("click", () => humanDrop(c));
      b.addEventListener("pointerenter", () => { hoverCol = c; renderGhost(); });
      b.addEventListener("focus", () => { hoverCol = c; renderGhost(); });
      b.addEventListener("keydown", (e) => {
        const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        hoverCol = (c + d + COLS) % COLS;
        const target = colsEl.children[hoverCol];
        if (!target.disabled) target.focus();
        renderGhost();
      });
      colsEl.appendChild(b);
      const n = document.createElement("span");
      n.textContent = c + 1;
      numbersEl.appendChild(n);
    }
    stage.addEventListener("pointerleave", () => { hoverCol = null; renderGhost(); });
    document.addEventListener("keydown", (e) => {
      if (e.target.closest && e.target.closest("input, textarea")) return;
      const n = Number(e.key);
      if (n >= 1 && n <= 7) { hoverCol = n - 1; humanDrop(n - 1); }
    });
    document.querySelectorAll('input[name="level"]').forEach((input) => {
      input.addEventListener("change", () => {
        state.difficulty = input.value;
        save();
        renderUI();
      });
    });
    document.querySelectorAll('input[name="mode"]').forEach((input) => {
      input.addEventListener("change", () => setMode(input.value));
    });
    $("new-game").addEventListener("click", newGame);
    $("undo").addEventListener("click", undo);
  }

  function start(data) {
    state = data && data.state ? data.state : freshState();
    if (!state.scores) { // carried over from the single-mode version
      state.scores = { ai: state.score || zeroScore(), pvp: zeroScore() };
      state.mode = "ai";
      delete state.score;
    }
    busy = false;
    bind();
    renderDiscs();
    renderUI();
    if (!state.over && !isPvp() && turn() === AI) scheduleAI();
  }
  window.claude?.hot?.snapshot?.(() => ({ state }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
